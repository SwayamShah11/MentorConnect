{% extends 'mentor/base1.html' %}
{% load static %}
{% block title %} Delete Conversation {% endblock %}
{% block content %}
<div class="container mt-4 px-3">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card shadow-sm p-4 text-center">
        <h4 class="text-danger mb-3">Delete Conversation</h4>
        <p class="mb-4">
          Are you sure you want to delete this conversation?
        </p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex flex-column flex-md-row gap-2">
            <button type="submit" class="btn btn-danger w-100">
              Delete
            </button>
            <a href="{% url 'conv1' %}" class="btn btn-secondary w-100">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
    /* --------------------- */
    /* MOBILE RESPONSIVENESS */
    /* --------------------- */
    @media (max-width: 768px) {

  h4 {
    font-size: 1.3rem;
  }

  p {
    font-size: 0.95rem;
  }

  .btn {
    font-size: 0.95rem;
    padding: 10px;
  }

  .card {
    border-radius: 12px;
  }
}

body {
  overflow-x: hidden;
}
</style>
{% endblock %}
