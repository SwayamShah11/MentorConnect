{% extends 'menti/base.html' %}
{% load static %}
{% block title %} Change Password {% endblock %}
{% block content %}
<div class="container mt-4 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">

            <form method="post" class="form-card" id="form">
                {% csrf_token %}
                <h4 class="text-center mb-4">Change Password</h4>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-info text-center">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <!-- New Password -->
                <div class="form-group mb-3 position-relative">
                    <label>New Password</label>
                    <input type="password" name="new_password" id="new_password"
                           class="form-control pe-5" placeholder="Enter new password" required>

                    <i class="fa fa-eye toggle-icon" data-target="new_password"></i>
                </div>

                <!-- Confirm Password -->
                <div class="form-group mb-3 position-relative">
                    <label>Re-enter New Password</label>
                    <input type="password" name="reconfirm_password" id="reconfirm_password"
                           class="form-control pe-5" placeholder="Confirm new password" required>

                    <i class="fa fa-eye toggle-icon" data-target="reconfirm_password"></i>
                </div>

                <input type="hidden" name="user_id" value="{{ user_id }}">

                <button class="btn btn-primary w-100 mt-3" type="submit">
                    Update Password
                </button>
            </form>

        </div>
    </div>
</div>
<script>
    document.querySelectorAll(".toggle-icon").forEach(icon => {
    icon.addEventListener("click", function () {
        const input = document.getElementById(this.dataset.target);
        if (!input) return;

        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";

        this.classList.toggle("fa-eye");
        this.classList.toggle("fa-eye-slash");
    });
});
</script>

<style>
    /* --------------------- */
    /* MOBILE RESPONSIVENESS */
    /* --------------------- */
.form-card {
  background: #020617;
  border-radius: 20px;
  padding: 30px 25px;
  border: 1px solid rgba(99, 102, 241, 0.25);

  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.9),
    0 0 30px rgba(99, 102, 241, 0.15);

  color: #e5e7eb;
}

/* Inputs */
.form-control {
  background-color: #020617;
  border: 1px solid rgba(99, 102, 241, 0.3);
  color: #e5e7eb;
  border-radius: 12px;
  padding: 12px;
}

.form-control::placeholder {
  color: #64748b;
}

.form-control:focus {
  background-color: #020617;
  color: #fff;
  border-color: #6366f1;
  box-shadow: 0 0 0 0.15rem rgba(99, 102, 241, 0.4);
}

/* Toggle icon (FIXED POSITIONING) */
.toggle-icon {
  position: absolute;
  right: 12px;
  top: 70%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #94a3b8;
  font-size: 0.9rem;
}

.toggle-icon:hover {
  color: #6366f1;
}

/* Button */
.btn-primary {
  border-radius: 999px;
  padding: 12px;
  font-weight: 600;
  background: linear-gradient(135deg, #4f46e5, #6366f1);
  border: none;
}

/* MOBILE FIXES */
@media (max-width: 768px) {

  .form-card {
    padding: 20px 15px;
  }

  h4 {
    font-size: 1.2rem;
  }

  .form-control {
    font-size: 0.95rem;
  }

  .toggle-icon {
    font-size: 0.8rem;
    right: 10px;
  }
}
</style>
{% endblock %}
