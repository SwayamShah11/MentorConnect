{% extends "menti/base.html" %}
{% block title %} Send Request {% endblock %}
{% load crispy_forms_tags %}

{% block content %}
<br>
<div class="container mt-4 px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
             <div class="content-section">
                <h2 class="text-center mb-3">Send Your Message</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-info w-100 mt-2">Send Message</button>
                </form>
             </div>
        </div>
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mt-4 gap-3">
            <a href="{% url 'account' %}"
               class="btn btn-warning btn-lg rounded-pill px-4 shadow-sm mx-5">
                <i class="bi bi-arrow-left-circle"></i> Back
            </a>
        </div>
    </div>
</div>

<style>
    /* --------------------- */
    /* MOBILE RESPONSIVENESS */
    /* --------------------- */
    @media (max-width: 768px) {

  h2 {
    font-size: 1.3rem;
  }

  .content-section {
    padding: 15px;
  }

  .form-control,
  .form-select,
  textarea {
    font-size: 0.95rem;
    padding: 10px;
  }

  .btn {
    font-size: 0.95rem;
    padding: 10px;
  }
}

.form-label {
  color: #fff;
}

body {
  overflow-x: hidden;
}
</style>
{% endblock %}
